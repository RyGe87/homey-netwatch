<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
  body { font-family: -apple-system, sans-serif; padding: 12px; }
  label { display:block; margin: 14px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 16px; }
  #result { margin-top: 14px; white-space: pre-wrap; }
  .hint { opacity: .7; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
  <h3 data-i18n="settings.title">UniFi-gateway</h3>
  <label>IP-adres</label>
  <input id="host" type="text" placeholder="192.168.1.1">
  <label>Lokale API-sleutel</label>
  <input id="apikey" type="password" placeholder="aangemaakt op de console zelf">
  <div class="hint">Maak de sleutel aan in de webinterface van de router zelf, niet via het cloudportaal. Een cloudsleutel werkt hier niet — en juist tijdens een storing is de cloud onbereikbaar.</div>
  <button id="save">Opslaan en testen</button>
  <div id="result"></div>

  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const host = document.getElementById('host');
      const apikey = document.getElementById('apikey');
      const result = document.getElementById('result');

      Homey.get('host', (err, value) => { host.value = value || '192.168.1.1'; });
      Homey.get('apikey', (err, value) => { apikey.value = value || ''; });

      document.getElementById('save').addEventListener('click', () => {
        result.textContent = 'Bezig met testen…';
        Homey.set('host', host.value.trim(), () => {});
        Homey.set('apikey', apikey.value.trim(), () => {
          Homey.api('GET', '/test', null, (err, data) => {
            if (err) { result.textContent = 'Mislukt: ' + (err.message || err); return; }
            result.textContent = 'Verbonden met ' + (data.gatewayName || 'de gateway')
              + '\nProvider: ' + (data.isp || 'onbekend')
              + '\nPubliek IP: ' + (data.publicIp || 'onbekend')
              + '\nApparaten: ' + (data.clients ?? '?');
          });
        });
      });

      Homey.ready();
    }
  </script>
</body>
</html>
